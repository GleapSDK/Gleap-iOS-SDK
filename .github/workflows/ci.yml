name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: .github/scripts/test.sh
      # Line coverage per target from the result bundle (the package scheme collects it); for reading, no floor.
      - name: Coverage summary
        if: always()
        run: |
          [ -d build/TestResults.xcresult ] || exit 0
          if report=$(xcrun xccov view --report --only-targets build/TestResults.xcresult 2>&1); then
            printf '### Coverage\n\n```\n%s\n```\n' "$report" >>"$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$report"
          else
            echo "No coverage in the result bundle: $report"
          fi
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 14
      - name: Lint podspec
        env:
          LANG: en_US.UTF-8
        run: pod lib lint Gleap.podspec --allow-warnings
