name: Quality

# scripts/lint-new.sh on what a PR adds compared with where it left the base: compiler and static analyzer warnings on
# added and changed lines, clang-format on added files, file size and the public API. Old code may stay as it is but
# must not get worse; new code keeps .claude/rules/code-conventions.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    # A fixed image and Xcode, so the analyzer and the API check do not change under a PR. When the image drops this
    # Xcode, move both together.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's own commit, not the merge commit, and the history to find the fork point.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      # The base branch's copy of the checks judges the PR, so a PR cannot switch a check off with its own edits.
      # The first PR that adds them has no such copy and runs its own.
      - name: Check what the PR adds
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          tools=scripts
          if git cat-file -e "origin/$BASE_REF:scripts/lint-new.sh" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/gate"
            git archive "origin/$BASE_REF" scripts .clang-format | tar -x -C "$RUNNER_TEMP/gate"
            tools="$RUNNER_TEMP/gate/scripts"
          fi
          changed="$(git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD -- scripts .clang-format Makefile .claude/hooks .claude/settings.json .githooks .github/workflows)"
          if [ -n "$changed" ]; then
            echo "::warning title=This PR changes the checks::Review these on purpose, they apply only after the merge: $(echo $changed)"
          fi
          sh "$tools/lint-new.sh" "origin/$BASE_REF"
